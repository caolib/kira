name: kira
description: "A comic reader app."
publish_to: "none"
version: 1.3.2+346
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.3.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  flex_color_picker: ^3.8.0
  scrollable_positioned_list: ^0.3.8
  crypto: ^3.0.7
  canvas_danmaku: ^0.3.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  archive: ^4.0.7
  screen_brightness: ^2.1.8
  wakelock_plus: ^1.3.3
  system_fonts: ^1.0.1
  flutter_displaymode: 0.7.0
  flutter_markdown_plus: ^1.0.3
  native_flutter_proxy: ^0.3.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  flutter_riverpod: ^3.0.0
  json_annotation: ^4.12.0
  material3_expressive_loading_indicator: ^0.1.2
  google_nav_bar: 5.0.7
  flutter_inappwebview: ^6.1.5
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

flutter_launcher_icons:
  image_path: "assets/ic_launcher.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/ic_launcher.png
    - assets/ic_launcher_1.png
    - assets/github.svg
    - assets/qq.svg
    - assets/danmaku_on.svg
    - assets/danmaku_off.svg
    - assets/danmaku_settings.svg
