name: 新的 feature 请求
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量详细描述你的需求、使用场景和期望效果，否则问题可能会被直接关闭

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 请说明你遇到的问题、当前不方便的地方，或这个 feature 想解决的具体场景。
      placeholder: 例如：在什么情况下需要这个功能？目前应用有什么限制？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 请详细描述你希望新增或改进的功能，以及理想中的交互或行为。
      placeholder: 例如：希望应用能够...，用户可以...，完成后应该看到...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可能的替代方案
      description: 如果你已经尝试过其他方式，或有不同实现想法，可以写在这里。
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏或参考资料
      description: 建议提交截图、视频、原型图或参考链接，帮助说明需求。可以直接拖拽文件到输入框上传。
    validations:
      required: false
