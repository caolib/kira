name: Build & Release

# 推送正式版 v* tag 触发，
# 也支持手动 dispatch：
# 1. 三个 ABI 的 APK 并行构建（arm / arm64 / x86_64，flutter build apk 不支持 32 位 x86），
#    复用 scripts/build_apk.ps1
# 2. Windows x64 安装包（Inno Setup），复用 scripts/build_windows.ps1
# 3. 直接创建公开 GitHub Release（标题 "App vX.Y.Z"，正文取标签快照内的 docs/CHANGELOG.md），
#    上传全部产物；日志须在提交与推送标签前完成审查
# 4. 读取已发布安装包的元信息，生成并上传 release.json；失败重跑不覆盖安装包
# 5. 清单上传成功后，将正式 Release 的 arm64 APK 与更新说明同步到固定 CI 预发布
on:
  push:
    tags:
      - "v*"
      - "!v*-beta*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号 (如 v0.1.0)"
        required: true
        default: "v0.1.0"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-platform: android-arm
            abi: armeabi-v7a
          - target-platform: android-arm64
            abi: arm64-v8a
          - target-platform: android-x64
            abi: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -s android/upload-keystore.jks
          test -s android/key.properties

          keytool -list -v \
            -keystore android/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            > /dev/null

      - name: Set up Flutter and locked dependencies
        uses: ./.github/actions/setup-flutter

      - name: Build APK
        shell: pwsh
        env:
          COPY_AUTH_KEY: ${{ secrets.COPY_AUTH_KEY }}
        run: scripts/build_apk.ps1 -TargetPlatform ${{ matrix.target-platform }} -Abi ${{ matrix.abi }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/kira-*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Flutter and locked dependencies
        uses: ./.github/actions/setup-flutter

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          # runner 预装 Inno Setup 6；不在 PATH 时补上（写入 GITHUB_PATH 供后续步骤使用）
          $isccCmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $isccDir = if ($isccCmd) { Split-Path $isccCmd.Source -Parent } else { 'C:\Program Files (x86)\Inno Setup 6' }
          if (-not $isccCmd) { Add-Content $env:GITHUB_PATH $isccDir }
          # 安装中文语言包（失败仅降级为英文安装界面）
          $zhIsl = Join-Path $isccDir 'Languages\ChineseSimplified.isl'
          if ((Test-Path (Join-Path $isccDir 'iscc.exe')) -and -not (Test-Path $zhIsl)) {
            try {
              Invoke-WebRequest `
                -Uri 'https://jrsoftware.org/files/istrans/ChineseSimplified.isl' `
                -OutFile $zhIsl -ErrorAction Stop
              Write-Host '已下载 ChineseSimplified.isl'
            } catch {
              Write-Host '提示: 下载 ChineseSimplified.isl 失败，安装界面将使用英文' -ForegroundColor DarkYellow
            }
          }

      - name: Build installer
        shell: pwsh
        env:
          COPY_AUTH_KEY: ${{ secrets.COPY_AUTH_KEY }}
        run: scripts/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: build/windows/installer/kira-*-setup.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          sparse-checkout: |
            docs/CHANGELOG.md
            pubspec.yaml
            scripts/generate_release_manifest.py
            test/scripts/generate_release_manifest_test.py
          sparse-checkout-cone-mode: false

      - name: Test release manifest generator
        run: python3 -I -m unittest discover -s test/scripts -p 'generate_release_manifest_test.py'

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create or reuse GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I scripts/generate_release_manifest.py create \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --artifacts artifacts/ \
            --notes docs/CHANGELOG.md

      - name: Generate and upload release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I scripts/generate_release_manifest.py upload \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"

  sync-ci-release:
    name: Sync release APK to CI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          sparse-checkout: |
            docs/CHANGELOG.md
            scripts/sync_release_to_ci.sh
          sparse-checkout-cone-mode: false

      - name: Download published arm64 APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir artifacts/
          gh release download "$RELEASE_TAG" \
            --repo="$GITHUB_REPOSITORY" \
            --pattern 'kira-*-arm64-v8a.apk' \
            --dir artifacts/

      - name: Sync APK and release notes to CI pre-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" bash scripts/sync_release_to_ci.sh artifacts/ docs/CHANGELOG.md
