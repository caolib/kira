name: Build & Release

# 推送 v* tag 触发（scripts/release.ps1 完成推送后自动接手），也支持手动 dispatch：
# 1. 三个 ABI 的 APK 并行构建（arm / arm64 / x86_64，flutter build apk 不支持 32 位 x86），
#    复用 scripts/build_apk.ps1
# 2. Windows x64 安装包（Inno Setup），复用 scripts/build_windows.ps1
# 3. 创建 GitHub Release 起草版本（标题 "App vX.Y.Z"，正文取 docs/CHANGELOG.md），
#    上传全部产物，人工核对后再发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号 (如 v0.1.0)"
        required: true
        default: "v0.1.0"

env:
  RELEASE_TAG: ${{ github.ref_name || github.event.inputs.tag_name }}

jobs:
  build-android:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-platform: android-arm
            abi: armeabi-v7a
          - target-platform: android-arm64
            abi: arm64-v8a
          - target-platform: android-x64
            abi: x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -s android/upload-keystore.jks
          test -s android/key.properties

          keytool -list -v \
            -keystore android/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            > /dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          set -euo pipefail

          test -n "$DANDANPLAY_APP_ID"
          test -n "$DANDANPLAY_APP_SECRET"

          cat > .env <<EOF
          DANDANPLAY_APP_ID=$DANDANPLAY_APP_ID
          DANDANPLAY_APP_SECRET=$DANDANPLAY_APP_SECRET
          EOF

      - name: Build APK
        shell: pwsh
        run: scripts/build_apk.ps1 -TargetPlatform ${{ matrix.target-platform }} -Abi ${{ matrix.abi }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/kira-*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env
        shell: pwsh
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DANDANPLAY_APP_ID)) { throw 'DANDANPLAY_APP_ID secret 未配置' }
          if ([string]::IsNullOrWhiteSpace($env:DANDANPLAY_APP_SECRET)) { throw 'DANDANPLAY_APP_SECRET secret 未配置' }
          Set-Content -Path .env -Value @(
            "DANDANPLAY_APP_ID=$env:DANDANPLAY_APP_ID"
            "DANDANPLAY_APP_SECRET=$env:DANDANPLAY_APP_SECRET"
          )

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          # runner 预装 Inno Setup 6；不在 PATH 时补上（写入 GITHUB_PATH 供后续步骤使用）
          $isccCmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $isccDir = if ($isccCmd) { Split-Path $isccCmd.Source -Parent } else { 'C:\Program Files (x86)\Inno Setup 6' }
          if (-not $isccCmd) { Add-Content $env:GITHUB_PATH $isccDir }
          # 安装中文语言包（失败仅降级为英文安装界面）
          $zhIsl = Join-Path $isccDir 'Languages\ChineseSimplified.isl'
          if ((Test-Path (Join-Path $isccDir 'iscc.exe')) -and -not (Test-Path $zhIsl)) {
            try {
              Invoke-WebRequest `
                -Uri 'https://jrsoftware.org/files/istrans/ChineseSimplified.isl' `
                -OutFile $zhIsl -ErrorAction Stop
              Write-Host '已下载 ChineseSimplified.isl'
            } catch {
              Write-Host '提示: 下载 ChineseSimplified.isl 失败，安装界面将使用英文' -ForegroundColor DarkYellow
            }
          }

      - name: Build installer
        shell: pwsh
        run: scripts/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: build/windows/installer/kira-*-setup.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ls -lh artifacts/

          # --draft: 仅创建起草版本，人工核对产物后再发布
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo="$GITHUB_REPOSITORY" \
            --title="App $RELEASE_TAG" \
            --notes-file docs/CHANGELOG.md \
            --draft
