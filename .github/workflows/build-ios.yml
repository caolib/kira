name: Publish unsigned iOS Beta IPA

on:
  workflow_dispatch:
    inputs:
      note:
        description: "构建说明（可选）"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      note:
        type: string
        default: ""
    secrets:
      COPY_AUTH_KEY:
        required: false

concurrency:
  group: ios-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-ios:
    uses: ./.github/workflows/build-ios-package.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
    secrets:
      COPY_AUTH_KEY: ${{ secrets.COPY_AUTH_KEY }}

  publish:
    name: Publish fixed ios-build prerelease
    needs: package-ios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Require package artifact IDs
        shell: bash
        env:
          IPA_ID: ${{ needs.package-ios.outputs.artifact_id }}
          PROVENANCE_ID: ${{ needs.package-ios.outputs.provenance_id }}
        run: test -n "$IPA_ID" && test -n "$PROVENANCE_ID"

      - name: Download sealed IPA (never transfer the bare .app)
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.package-ios.outputs.artifact_id }}
          path: artifacts/ios-release
          merge-multiple: true

      - name: Download native lock and toolchain provenance
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.package-ios.outputs.provenance_id }}
          path: artifacts/ios-provenance-download
          merge-multiple: true

      - name: Validate assets and update ios-build without moving its tag
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
          VERIFY_ANALYSIS: ${{ needs.package-ios.outputs.analysis }}
          VERIFY_SCRIPTS: ${{ needs.package-ios.outputs.scripts }}
          FLUTTER_TESTS: ${{ needs.package-ios.outputs.flutter_tests }}
          SIMULATOR_TEST: ${{ needs.package-ios.outputs.simulator_test }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" bash scripts/publish_ios_release.sh artifacts/ios-release \
            artifacts/ios-provenance-download/toolchain.txt \
            artifacts/ios-provenance-download/native-lock.txt
