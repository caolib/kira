name: Build & Release (Beta)

# 手动触发（workflow_dispatch），不随 tag 推送自动运行：
# 1. Android arm64-v8a APK
# 2. Windows x64 安装包（Inno Setup），复用 scripts/build_windows.ps1
# 3. macOS / Linux 包
# 4. 创建 GitHub Pre-Release，上传全部产物

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号 (如 v1.2.0-beta)"
        required: true
        default: "v0.0.0-beta"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name }}

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          mv app-release.apk "kira-${RELEASE_TAG}-arm64-v8a.apk"
          ls -lh kira-*.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/kira-*.apk

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          # runner 预装 Inno Setup 6；不在 PATH 时补上（写入 GITHUB_PATH 供后续步骤使用）
          $isccCmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $isccDir = if ($isccCmd) { Split-Path $isccCmd.Source -Parent } else { 'C:\Program Files (x86)\Inno Setup 6' }
          if (-not $isccCmd) { Add-Content $env:GITHUB_PATH $isccDir }
          # 安装中文语言包（失败仅降级为英文安装界面）
          $zhIsl = Join-Path $isccDir 'Languages\ChineseSimplified.isl'
          if ((Test-Path (Join-Path $isccDir 'iscc.exe')) -and -not (Test-Path $zhIsl)) {
            try {
              Invoke-WebRequest `
                -Uri 'https://jrsoftware.org/files/istrans/ChineseSimplified.isl' `
                -OutFile $zhIsl -ErrorAction Stop
              Write-Host '已下载 ChineseSimplified.isl'
            } catch {
              Write-Host '提示: 下载 ChineseSimplified.isl 失败，安装界面将使用英文' -ForegroundColor DarkYellow
            }
          }

      - name: Build installer
        shell: pwsh
        run: scripts/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: build/windows/installer/kira-*-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP" ]; then echo '未找到 .app'; exit 1; fi
          mkdir -p dist
          OUT="dist/kira-${RELEASE_TAG}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          ls -lh "$OUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/kira-*.zip

  build-linux:
    name: Build Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            mpv libmpv-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/kira-${RELEASE_TAG}-linux-x64.tar.gz"
          tar -czf "$OUT" -C build/linux/x64/release/bundle .
          ls -lh "$OUT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/kira-*.tar.gz

  release:
    name: Create Beta Pre-Release
    needs: [build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f -print

      - name: Create GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_ARGS=()
          if [ -f docs/CHANGELOG.md ]; then
            NOTES_ARGS=(--notes-file docs/CHANGELOG.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi
          mapfile -t FILES < <(find artifacts -type f)
          gh release create "$RELEASE_TAG" "${FILES[@]}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="App $RELEASE_TAG" \
            --prerelease \
            "${NOTES_ARGS[@]}"
